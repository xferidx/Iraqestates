 if(!phc[id]){$("#lbi").removeAttribute("src");$("#lbt").textContent="…";$("#lb").showModal();try{const sn=await getDocs(collection(db,"listings",id,"photos"));phc[id]=sn.docs.sort((p,q)=>p.id-q.id).map(d=>d.data().d).filter(okFull)}catch(x){$("#lb").close();return}}
 lbs=phc[id];if(!lbs.length){$("#lb").close();return}lb(0);if(!$("#lb").open)$("#lb").showModal()});

 const f=e.target,u=auth.currentUser;if(!u)return;const mp=normMap(f.loc.value);if(mp===null){e.preventDefault();alert(T[lang].maperr);return}
 e.preventDefault();const pb=$("#pub");pb.disabled=true;pb.textContent=T[lang].upl;
 const o={uid:u.uid,title:f.title.value.trim(),mode:f.mode.value,type:f.type.value,city:f.city.value,hood:f.hood.value.trim(),price:+f.price.value,cur:f.cur.value,beds:+f.beds.value,baths:+f.baths.value,area:+f.area.value,phone:f.phone.value.trim(),desc:f.desc.value.trim(),map:mp,own:f.own.value,furn:f.furn.value,age:f.age.value,floor:+f.floor.value||0,neg:f.neg.checked};
 try{if(editId){const c=user.find(z=>z.id==editId)||{};o.status=c.status||"active";if(pics.length){const r=await phSave(editId,pics.map(p=>p.file),c.pn||0);o.thumb=r.thumb;o.pn=r.pn;delete phc[editId]}await updateDoc(doc(db,"listings",editId),o)}else{o.status="active";o.createdAt=serverTimestamp();o.thumb="";o.pn=0;const ref=await addDoc(collection(db,"listings"),o);if(pics.length){const r=await phSave(ref.id,pics.map(p=>p.file),0);await updateDoc(ref,{thumb:r.thumb,pn:r.pn})}}f.reset();pics=[];$("#dlg").close();window.scrollTo({top:0,behavior:"smooth"})}catch(x){alert(T[lang].err)}
 pb.disabled=false;pb.textContent=editId?T[lang].save:T[lang].publish
};

 try{if(a=="edit")openForm(x);else if(a=="del"){if(confirm(T[lang].delq)){for(let i=0;i<(x.pn||0);i++)await deleteDoc(doc(db,"listings",id,"photos",String(i)));await deleteDoc(r)}}else if(a=="close")await updateDoc(r,{status:x.status=="closed"?"active":"closed"});else if(a=="renew")await updateDoc(r,{createdAt:serverTimestamp()})}catch(x){alert(T[lang].err)}});
