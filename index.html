<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عقارات العراق | Iraq Estates</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2a2e;--mu:#6a7679;--pr:#0f5c55;--pr2:#e9f3f1;--ac:#c8963e;--bd:#e3dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121819;--card:#1b2325;--tx:#e9eeee;--mu:#9aa8aa;--pr:#3fb5a8;--pr2:#16312f;--ac:#e0b05a;--bd:#2c3739}}
:root[data-theme="dark"]{--bg:#121819;--card:#1b2325;--tx:#e9eeee;--mu:#9aa8aa;--pr:#3fb5a8;--pr2:#16312f;--ac:#e0b05a;--bd:#2c3739}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,Tahoma,sans-serif;line-height:1.6}
header{background:var(--pr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font-weight:700;font-size:20px}
.logo span{color:#f3d48f}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#1d1a12;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.hero{background:var(--pr);color:#fff;padding:22px 16px 60px;text-align:center}
.hero h1{margin:0 0 4px;font-size:clamp(22px,5vw,34px)}
.hero p{margin:0;opacity:.85}
main{max-width:1100px;margin:-40px auto 40px;padding:0 16px}
.filters{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.filters label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}
.filters input,.filters select,.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.tabs{display:flex;gap:6px;grid-column:1/-1}
.tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:600}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px;color:var(--mu);flex-wrap:wrap;gap:8px}
.link{background:none;border:0;color:var(--pr);cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,var(--pr2),var(--bg));position:relative}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--pr);color:#fff;font-size:12px;padding:2px 10px;border-radius:20px;font-family:inherit}
.badge.rent{background:var(--ac);color:#1d1a12}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:16px}
.price{color:var(--pr);font-weight:700;font-size:18px}
.loc,.spec{color:var(--mu);font-size:13px}
.spec{display:flex;gap:12px;flex-wrap:wrap}
.cb a{margin-top:auto;text-align:center;text-decoration:none;background:var(--pr2);color:var(--pr);padding:8px;border-radius:10px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 0;grid-column:1/-1}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .full{grid-column:1/-1}
.f label{font-size:12px;color:var(--mu)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:16px}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo">🏠 <span data-i="brand"></span></div>
<div style="display:flex;gap:8px">
<button class="btn ghost" id="lang">English</button>
<button class="btn" id="add" data-i="add"></button>
</div></div></header>

<section class="hero"><h1 data-i="h1"></h1><p data-i="sub"></p></section>

<main>
<div class="filters">
<div class="tabs">
<button class="tab on" data-m="">الكل</button>
<button class="tab" data-m="sale"></button>
<button class="tab" data-m="rent"></button>
</div>
<div><label data-i="q"></label><input id="q" type="search"></div>
<div><label data-i="city"></label><select id="city"></select></div>
<div><label data-i="ptype"></label><select id="ptype"></select></div>
<div><label data-i="pmin"></label><input id="pmin" type="number" min="0" inputmode="numeric"></div>
<div><label data-i="pmax"></label><input id="pmax" type="number" min="0" inputmode="numeric"></div>
<div><label data-i="beds"></label><select id="beds"></select></div>
<div><label data-i="amin"></label><input id="amin" type="number" min="0" inputmode="numeric"></div>
<div><label data-i="sort"></label><select id="sort"></select></div>
</div>
<div class="meta"><span id="count"></span><button class="link" id="reset" data-i="reset"></button></div>
<div class="grid" id="grid"></div>
</main>
<footer data-i="foot"></footer>

<dialog id="dlg"><form method="dialog" class="f" id="form">
<h3 class="full" style="margin:0" data-i="addT"></h3>
<div class="full"><label data-i="fTitle"></label><input name="title" required maxlength="80"></div>
<div><label data-i="mode"></label><select name="mode"></select></div>
<div><label data-i="ptype"></label><select name="type"></select></div>
<div><label data-i="city"></label><select name="city"></select></div>
<div><label data-i="hood"></label><input name="hood" maxlength="60"></div>
<div><label data-i="price"></label><input name="price" type="number" min="1" required inputmode="numeric"></div>
<div><label data-i="cur"></label><select name="cur"><option value="USD">$ USD</option><option value="IQD">IQD</option></select></div>
<div><label data-i="beds"></label><input name="beds" type="number" min="0" max="20" value="3" inputmode="numeric"></div>
<div><label data-i="baths"></label><input name="baths" type="number" min="0" max="20" value="2" inputmode="numeric"></div>
<div><label data-i="area"></label><input name="area" type="number" min="1" required inputmode="numeric"></div>
<div><label data-i="phone"></label><input name="phone" type="tel" required placeholder="07XX XXX XXXX" dir="ltr"></div>
<div class="full"><label data-i="desc"></label><textarea name="desc" rows="3" maxlength="400"></textarea></div>
<div class="row full"><button type="button" class="btn sec" id="cancel" data-i="cancel"></button><button class="btn" type="submit" data-i="publish"></button></div>
</form></dialog>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,orderBy,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// الصق إعدادات مشروعك من Firebase Console هنا / paste your Firebase config here
const firebaseConfig={apiKey:"AIzaSyBBr8-4JxczuFJXbJ7F8zNQhdKcYbZZEC8",authDomain:"estates-502c4.firebaseapp.com",projectId:"estates-502c4",storageBucket:"estates-502c4.firebasestorage.app",messagingSenderId:"201310146198",appId:"1:201310146198:web:341f98d4069a900d97bcb7"};
const RATE=1520;
const CITIES=[["baghdad","بغداد","Baghdad"],["basra","البصرة","Basra"],["nineveh","الموصل","Mosul"],["erbil","أربيل","Erbil"],["sulaymaniyah","السليمانية","Sulaymaniyah"],["duhok","دهوك","Duhok"],["kirkuk","كركوك","Kirkuk"],["najaf","النجف","Najaf"],["karbala","كربلاء","Karbala"],["anbar","الرمادي","Ramadi"],["diyala","بعقوبة","Baqubah"],["babil","الحلة","Hillah"],["wasit","الكوت","Kut"],["dhiqar","الناصرية","Nasiriyah"],["maysan","العمارة","Amarah"],["muthanna","السماوة","Samawah"],["qadisiyyah","الديوانية","Diwaniyah"],["salahaldin","تكريت","Tikrit"],["halabja","حلبجة","Halabja"]];
const TYPES=[["house","بيت","House","🏡"],["apartment","شقة","Apartment","🏢"],["villa","فيلا","Villa","🏘️"],["land","أرض","Land","🟫"],["shop","محل تجاري","Shop","🏪"],["office","مكتب","Office","💼"]];
const T={ar:{brand:"عقارات العراق",add:"+ أضف عقارك",h1:"ابحث عن بيتك في أي مدينة عراقية",sub:"بيع وإيجار بيوت وشقق وأراضي في جميع المحافظات",q:"بحث بالكلمات",city:"المدينة",ptype:"نوع العقار",pmin:"أقل سعر ($)",pmax:"أعلى سعر ($)",beds:"غرف النوم",amin:"أقل مساحة (م²)",sort:"الترتيب",reset:"مسح الفلاتر",all:"الكل",allC:"كل المدن",allT:"كل الأنواع",any:"أي عدد",sale:"للبيع",rent:"للإيجار",newest:"الأحدث",pa:"السعر: الأقل أولاً",pd:"السعر: الأعلى أولاً",aD:"المساحة: الأكبر",found:n=>`${n} عقار`,none:"لا توجد نتائج مطابقة",call:"اتصل بالمالك",mo:"/شهرياً",bed:"غرف",bath:"حمامات",m2:"م²",foot:"عقارات العراق © 2026",addT:"أضف عقارك",fTitle:"عنوان الإعلان",mode:"نوع العرض",hood:"الحي / المنطقة",price:"السعر",cur:"العملة",baths:"الحمامات",area:"المساحة (م²)",phone:"رقم الهاتف",desc:"وصف",cancel:"إلغاء",publish:"نشر الإعلان",lang:"English",del:"حذف إعلاني",delq:"هل تريد حذف هذا الإعلان؟",err:"تعذّر النشر، حاول مرة أخرى"},
en:{brand:"Iraq Estates",add:"+ List property",h1:"Find your home in any Iraqi city",sub:"Houses, apartments and land for sale or rent across all governorates",q:"Keyword search",city:"City",ptype:"Property type",pmin:"Min price ($)",pmax:"Max price ($)",beds:"Bedrooms",amin:"Min area (m²)",sort:"Sort by",reset:"Clear filters",all:"All",allC:"All cities",allT:"All types",any:"Any",sale:"For sale",rent:"For rent",newest:"Newest",pa:"Price: low to high",pd:"Price: high to low",aD:"Area: largest",found:n=>`${n} propert${n==1?"y":"ies"}`,none:"No matching results",call:"Call owner",mo:"/month",bed:"beds",bath:"baths",m2:"m²",foot:"Iraq Estates © 2026",addT:"List your property",fTitle:"Listing title",mode:"Listing type",hood:"Neighborhood",price:"Price",cur:"Currency",baths:"Bathrooms",area:"Area (m²)",phone:"Phone number",desc:"Description",cancel:"Cancel",publish:"Publish listing",lang:"العربية",del:"Delete my listing",delq:"Delete this listing?",err:"Could not publish, please try again"}};
let lang=localStorage.getItem("lang")||"ar",mode="",user=[];
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const CK=new Set(CITIES.map(c=>c[0])),TK=new Set(TYPES.map(t=>t[0]));
onSnapshot(query(collection(db,"listings"),orderBy("createdAt","desc"),limit(200)),sn=>{user=sn.docs.map(d=>({...d.data(),id:d.id,t:d.data().createdAt?.toMillis?.()||Date.now()})).filter(x=>CK.has(x.city)&&TK.has(x.type));render()},()=>{});
onAuthStateChanged(auth,()=>render());
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const L=i=>lang=="ar"?0:1;
const usd=x=>x.cur=="USD"?x.price:x.price/RATE;
const nm=a=>a[lang=="ar"?1:2];
const opt=(v,t)=>`<option value="${v}">${t}</option>`;
function txt(v){return typeof v=="string"?v:v[L()]}
function setLang(){
 const d=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 $$("[data-i]").forEach(e=>e.textContent=d[e.dataset.i]);
 $("#lang").textContent=d.lang;
 $$(".tab").forEach(t=>t.textContent=t.dataset.m==""?d.all:d[t.dataset.m]);
 const keep={city:$("#city").value,ptype:$("#ptype").value,beds:$("#beds").value,sort:$("#sort").value};
 $("#city").innerHTML=opt("",d.allC)+CITIES.map(c=>opt(c[0],nm(c))).join("");
 $("#ptype").innerHTML=opt("",d.allT)+TYPES.map(c=>opt(c[0],nm(c))).join("");
 $("#beds").innerHTML=opt("",d.any)+[1,2,3,4,5].map(n=>opt(n,n+"+")).join("");
 $("#sort").innerHTML=opt("new",d.newest)+opt("pa",d.pa)+opt("pd",d.pd)+opt("ad",d.aD);
 for(const k in keep)if(keep[k])$("#"+k).value=keep[k];
 const f=$("#form");
 f.city.innerHTML=CITIES.map(c=>opt(c[0],nm(c))).join("");
 f.type.innerHTML=TYPES.map(c=>opt(c[0],nm(c))).join("");
 f.mode.innerHTML=opt("sale",d.sale)+opt("rent",d.rent);
 render();
}
function render(){
 const d=T[lang],q=$("#q").value.trim().toLowerCase(),c=$("#city").value,p=$("#ptype").value,
 mn=+$("#pmin").value||0,mx=+$("#pmax").value||Infinity,b=+$("#beds").value||0,am=+$("#amin").value||0;
 let r=user.filter(x=>(!mode||x.mode==mode)&&(!c||x.city==c)&&(!p||x.type==p)&&usd(x)>=mn&&usd(x)<=mx&&x.beds>=b&&x.area>=am&&
  (!q||(txt(x.title)+" "+txt(x.hood)+" "+(x.desc||"")+" "+nm(CITIES.find(k=>k[0]==x.city))).toLowerCase().includes(q)));
 const s=$("#sort").value;
 r.sort((a,b)=>s=="pa"?usd(a)-usd(b):s=="pd"?usd(b)-usd(a):s=="ad"?b.area-a.area:b.t-a.t);
 $("#count").textContent=d.found(r.length);
 const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
 $("#grid").innerHTML=r.length?r.map(x=>{
  const ty=TYPES.find(k=>k[0]==x.type),ci=CITIES.find(k=>k[0]==x.city);
  const pr=(x.cur=="USD"?"$"+x.price.toLocaleString("en"):x.price.toLocaleString("en")+" IQD")+(x.mode=="rent"?d.mo:"");
  return `<article class="card"><div class="thumb">${ty[3]}<span class="badge ${x.mode}">${d[x.mode]}</span></div><div class="cb"><h3>${esc(txt(x.title))}</h3><div class="price">${pr}</div><div class="loc">📍 ${nm(ci)}${x.hood&&txt(x.hood)?" — "+esc(txt(x.hood)):""}</div><div class="spec"><span>${nm(ty)}</span><span>${x.area} ${d.m2}</span>${x.beds?`<span>🛏 ${x.beds} ${d.bed}</span>`:""}${x.baths?`<span>🚿 ${x.baths} ${d.bath}</span>`:""}</div>${x.desc?`<div class="loc">${esc(x.desc)}</div>`:""}${auth.currentUser&&x.uid==auth.currentUser.uid?`<button class="link" data-del="${x.id}">🗑 ${d.del}</button>`:""}<a href="tel:${esc(x.phone)}" dir="ltr">📞 ${d.call}</a></div></article>`}).join(""):`<div class="empty">${d.none}</div>`;
}
$$(".tab").forEach(t=>t.onclick=()=>{mode=t.dataset.m;$$(".tab").forEach(x=>x.classList.toggle("on",x==t));render()});
["q","city","ptype","pmin","pmax","beds","amin","sort"].forEach(i=>$("#"+i).addEventListener("input",render));
$("#reset").onclick=()=>{["q","pmin","pmax","amin"].forEach(i=>$("#"+i).value="");["city","ptype","beds"].forEach(i=>$("#"+i).value="");$("#sort").value="new";mode="";$$(".tab").forEach((x,i)=>x.classList.toggle("on",i==0));render()};
$("#lang").onclick=()=>{lang=lang=="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}setLang()};
$("#add").onclick=async()=>{try{if(!auth.currentUser)await signInWithPopup(auth,new GoogleAuthProvider());$("#dlg").showModal()}catch(e){}};
$("#cancel").onclick=()=>$("#dlg").close();
$("#form").onsubmit=async e=>{
 const f=e.target,u=auth.currentUser;if(!u)return;
 const o={uid:u.uid,title:f.title.value.trim(),mode:f.mode.value,type:f.type.value,city:f.city.value,hood:f.hood.value.trim(),price:+f.price.value,cur:f.cur.value,beds:+f.beds.value,baths:+f.baths.value,area:+f.area.value,phone:f.phone.value.trim(),desc:f.desc.value.trim(),createdAt:serverTimestamp()};
 try{await addDoc(collection(db,"listings"),o);f.reset();window.scrollTo({top:0,behavior:"smooth"})}catch(x){alert(T[lang].err)}
};
$("#grid").addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(b&&confirm(T[lang].delq))try{await deleteDoc(doc(db,"listings",b.dataset.del))}catch(x){}});
setLang();
</script>
</body>
</html>
